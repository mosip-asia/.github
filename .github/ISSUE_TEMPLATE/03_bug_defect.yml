name: "🐛 Bug & Defect Report"
description: "Report a software defect, failed deployment, probe timeout, or regression"
title: "[Bug]: <Short description of issue>"
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🐛 Bug & Defect Report
        Please provide reproducible steps and diagnostic logs so engineers can diagnose the issue quickly.

  - type: dropdown
    id: pillar
    attributes:
      label: Affected Pillar
      description: Which pillar or repository is affected?
      options:
        - "Pillar 1: DPI Platform & Sandbox"
        - "Pillar 2: Biometric R&D & Face-PAD"
        - "Pillar 3: AI Assistant & Agents"
        - "Pillar 4: Digital Applications & Ecosystem"
    validations:
      required: true

  - type: textarea
    id: bug_description
    attributes:
      label: Bug Description
      description: What went wrong?
      placeholder: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to trigger the defect.
      placeholder: |
        1. Run command './deploy.sh'
        2. Wait for pod 'keycloak' to reach Ready state
        3. Probe failure triggers CrashLoopBackOff after 120s
    validations:
      required: true

  - type: textarea
    id: expected_vs_actual
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen versus what actually occurred?
      placeholder: Expected 200 OK on /ida/actuator/health, received 503 Service Unavailable.
    validations:
      required: true

  - type: textarea
    id: logs_and_diagnostics
    attributes:
      label: Diagnostic Logs & Stack Traces
      description: Paste relevant command outputs, `kubectl describe` snippets, or error traces.
      render: shell
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment Details
      description: Cloud provider, OS, VM family, k8s version, or browser version.
      placeholder: "e.g., GCP e2-standard-8, Ubuntu 22.04, k3s v1.28, Chrome 128"
    validations:
      required: true
